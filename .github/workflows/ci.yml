name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mypy httpx respx

      - name: Generate protobuf stubs
        run: make proto

      - name: Ruff lint
        run: ruff check app/ tests/ bench/

      - name: Type check (mypy)
        run: >-
          mypy
          app/cancel
          app/core
          app/gateway
          app/generation
          app/middleware
          app/producer
          app/sse
          app/store
          app/upstream
          app/grpc_server/server.py
          tests/
          bench/

      - name: Run pytest
        run: pytest tests/ -v
