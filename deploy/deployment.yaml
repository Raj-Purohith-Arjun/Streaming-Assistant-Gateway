apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-assistant-gateway
  labels:
    app: streaming-assistant-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streaming-assistant-gateway
  template:
    metadata:
      labels:
        app: streaming-assistant-gateway
    spec:
      containers:
        - name: gateway
          image: streaming-assistant-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: streaming-assistant-gateway-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
