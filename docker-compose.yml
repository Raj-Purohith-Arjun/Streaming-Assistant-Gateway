services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      REDIS_URL: redis://redis:6379/0
      GRPC_UPSTREAM_TARGET: mock-upstream:50052
      RATE_LIMIT_REQUESTS_PER_MINUTE: 120
      RATE_LIMIT_BURST: 30
    depends_on:
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-upstream:
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "50052"]
    ports:
      - "50052:50052"
