[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-assistant-gateway"
version = "0.1.0"
description = "High-performance streaming assistant gateway with FastAPI and gRPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "grpcio>=1.67.0",
  "grpcio-tools>=1.67.0",
  "protobuf>=5.28.0",
  "redis[hiredis]>=5.2.0",
  "structlog>=24.4.0",
  "pydantic-settings>=2.6.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "black>=24.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["app/grpc_server/generated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
